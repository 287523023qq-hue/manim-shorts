[CLI]
# 默认渲染输出目录
media_dir = output

[custom_folders]
media_dir = output
video_dir = {media_dir}/videos/{module_name}/{quality}
images_dir = {media_dir}/images/{module_name}

# 默认竖屏设置 (9:16)
pixel_width = 1080
pixel_height = 1920
frame_width = 9.0
frame_height = 16.0
frame_rate = 30
background_color = #0E1117
background_opacity = 1.0

# 预览草稿质量配置 (快速迭代)
[preview]
pixel_width = 540
pixel_height = 960
frame_width = 9.0
frame_height = 16.0
frame_rate = 20
background_color = #0E1117

# 标清竖屏配置 (测试流畅度)
[low_quality]
pixel_width = 720
pixel_height = 1280
frame_width = 9.0
frame_height = 16.0
frame_rate = 30
background_color = #0E1117

# 高清全画质配置 (成品发布: 1080x1920 60fps)
[high_quality]
pixel_width = 1080
pixel_height = 1920
frame_width = 9.0
frame_height = 16.0
frame_rate = 60
background_color = #0E1117
